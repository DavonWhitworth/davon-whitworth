<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pop</title>
    <!--
      Host page for the Unity WebGL build in ./Build, based on the project's
      custom WebGL template. It is shown inside an iframe on /pop. The game is
      square: #stage is the largest centered square that fits, so a fullscreen
      view gets dark bars instead of a stretched or wider picture.
      The game removes #loadingSplash itself (Assets/Plugins/webgl.jslib).
    -->
    <style>
      @font-face {
        font-family: "stickyNote";
        src: url("webAssets/stickyNotes.ttf");
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: "stickyNote", system-ui, sans-serif;
      }
      #stage {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vmin;
        height: 100vmin;
        transform: translate(-50%, -50%);
        background: #7092be;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #7092be;
        outline: none;
      }
      #loadingSplash {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px;
        text-align: center;
        color: #fff;
        background: #7092be;
        font-size: clamp(1.5rem, 8vmin, 3rem);
      }
      #loadingSplash h3 {
        margin: 0;
        font-weight: normal;
      }
      #bar {
        width: min(280px, 60%);
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.35);
        overflow: hidden;
      }
      #bar-fill {
        width: 0;
        height: 100%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" tabindex="1"></canvas>
      <div id="loadingSplash" role="status">
        <h3 id="splash-text">Loading :)</h3>
        <div id="bar"><div id="bar-fill"></div></div>
      </div>
    </div>

    <script src="Build/Pop_build.loader.js"></script>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var splashText = document.getElementById("splash-text");
      var bar = document.getElementById("bar");
      var barFill = document.getElementById("bar-fill");

      function removeSplash() {
        var splash = document.getElementById("loadingSplash");
        if (splash) splash.remove();
      }

      createUnityInstance(
        canvas,
        {
          dataUrl: "Build/Pop_build.data",
          frameworkUrl: "Build/Pop_build.framework.js",
          codeUrl: "Build/Pop_build.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "GAGE",
          productName: "pop",
          productVersion: "1.0",
        },
        function (progress) {
          barFill.style.width = Math.round(progress * 100) + "%";
        }
      )
        .then(function () {
          // The game removes the splash itself once its first scene starts.
          // This is only a fallback in case that call never arrives.
          setTimeout(removeSplash, 8000);
          // Give the game the keyboard as soon as it is running.
          window.focus();
          canvas.focus();
        })
        .catch(function (error) {
          bar.hidden = true;
          splashText.textContent =
            "The game could not start. Try reloading the page. (" + error + ")";
        });
    </script>
  </body>
</html>
