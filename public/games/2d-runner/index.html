<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>2D Runner</title>
    <!--
      Host page for the Unity WebGL build in ./Build. It is shown inside an
      iframe on /2d-runner. The canvas fills the frame; the frame keeps the
      game's 16:9 shape. To ship a new build, replace the files in ./Build with
      the same names (or update the four file names in the script below).
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #231f20;
        color: #e6e2d9;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #231f20;
        outline: none;
      }
      #status {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 16px;
      }
      #status[hidden] {
        display: none;
      }
      #bar {
        width: min(280px, 60%);
        height: 6px;
        border-radius: 3px;
        background: #3b3b3b;
        overflow: hidden;
      }
      #bar-fill {
        width: 0;
        height: 100%;
        background: #94b8a6;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="status" role="status">
      <p id="status-text">Loading the game&hellip;</p>
      <div id="bar"><div id="bar-fill"></div></div>
    </div>

    <script src="Build/2DRunner_Build.loader.js"></script>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var statusEl = document.getElementById("status");
      var statusText = document.getElementById("status-text");
      var bar = document.getElementById("bar");
      var barFill = document.getElementById("bar-fill");

      createUnityInstance(
        canvas,
        {
          dataUrl: "Build/2DRunner_Build.data",
          frameworkUrl: "Build/2DRunner_Build.framework.js",
          codeUrl: "Build/2DRunner_Build.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DavonWhitworth",
          productName: "2DRunner",
          productVersion: "1.0",
        },
        function (progress) {
          barFill.style.width = Math.round(progress * 100) + "%";
        }
      )
        .then(function () {
          statusEl.hidden = true;
          // Give the game the keyboard as soon as it is running.
          window.focus();
          canvas.focus();
        })
        .catch(function (error) {
          bar.hidden = true;
          statusText.textContent =
            "The game could not start. Try reloading the page. (" + error + ")";
        });
    </script>
  </body>
</html>
